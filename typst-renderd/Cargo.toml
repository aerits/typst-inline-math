[package]
name = "typst-renderd"
version = "0.1.0"
edition = "2024"
description = "Persistent JSONL IPC renderer for Typst math SVGs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typst = "0.15.1"
typst-kit = { version = "0.15.1", features = ["scan-fonts", "embedded-fonts"] }
typst-layout = "0.15.1"
typst-svg = "0.15.1"
